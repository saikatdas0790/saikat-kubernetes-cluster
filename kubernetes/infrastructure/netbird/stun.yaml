apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-stun
  namespace: netbird
  annotations:
    configmap.reloader.stakater.com/reload: netbird-stun
spec:
  selector:
    matchLabels:
      app: netbird-stun
  template:
    metadata:
      labels:
        app: netbird-stun
    spec:
      automountServiceAccountToken: false
      # ! Cross-node Cilium SNAT would make STUN report node IPs instead of device IPs.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: stun
          image: docker.io/coturn/coturn:4.19.2-r0
          args:
            - -c
            - /etc/coturn/turnserver.conf
          volumeMounts:
            - name: configuration
              mountPath: /etc/coturn
              readOnly: true
          ports:
            - name: stun
              containerPort: 3478
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: 3478
      volumes:
        - name: configuration
          configMap:
            name: netbird-stun
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-stun
  namespace: netbird
data:
  turnserver.conf: |
    stun-only
    no-tls
    no-cli
    log-file=stdout
