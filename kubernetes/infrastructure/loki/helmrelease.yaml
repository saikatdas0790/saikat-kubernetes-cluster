apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.7.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
  timeout: 10m
  upgrade:
    # RetryOnFailure retries failed upgrades without rollback/uninstall remediation.
    # This is the recommended strategy for StatefulSets (per Flux docs):
    # "RetryOnFailure is suitable for statefulsets and other workloads that cannot
    # tolerate rollbacks and have a high rollout duration susceptible to health
    # check timeouts and transient capacity errors."
    # The default RemediateOnFailure strategy uses rollback, which fails with
    # MissingRollbackTarget when there's no previous successful release (e.g.
    # after a prune + recreate).
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        path_prefix: /var/loki/rustfs
        replication_factor: 1
      compactor:
        retention_enabled: true
        delete_request_store: s3
      limits_config:
        # Required for the Grafana Logs Drilldown plugin's log volume histogram
        volume_enabled: true
        # Retain logs for 30 days; compactor enforces deletion.
        retention_period: 720h
        # Reject log entries with timestamps older than 7 days. This is the
        # default but set explicitly so it's visible. Alloy's start_time filter
        # should prevent old entries from being sent, but this acts as a safety
        # net and produces cleaner error messages than the default.
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      storage:
        type: s3
        bucketNames:
          chunks: saikat-kubernetes-loki-log-chunks-index-and-rules
          ruler: saikat-kubernetes-loki-log-chunks-index-and-rules
        s3:
          endpoint: http://rustfs-svc.rustfs.svc.cluster.local:9000
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
          accessKeyId: ${RUSTFS_ACCESS_KEY}
          secretAccessKey: ${RUSTFS_SECRET_KEY}
      schemaConfig:
        configs:
          - from: "2026-08-20"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

    singleBinary:
      replicas: 1
      initContainers:
        - name: wait-for-rustfs-bucket
          image: rustfs/rustfs:1.0.6
          command: [curl]
          args:
            - --fail-with-body
            - --show-error
            - --connect-timeout
            - "10"
            - --max-time
            - "30"
            - --retry
            - "30"
            - --retry-delay
            - "2"
            - --retry-max-time
            - "300"
            - --retry-all-errors
            - --aws-sigv4
            - aws:amz:us-east-1:s3
            - --variable
            - "%RUSTFS_ACCESS_KEY"
            - --variable
            - "%RUSTFS_SECRET_KEY"
            - --expand-user
            - "{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}"
            - --head
            - http://rustfs-svc.rustfs.svc.cluster.local:9000/saikat-kubernetes-loki-log-chunks-index-and-rules
          envFrom:
            - secretRef:
                name: loki-rustfs-credentials
      extraEnvFrom:
        - secretRef:
            name: loki-rustfs-credentials
      extraArgs:
        - -config.expand-env=true
      persistence:
        # Longhorn volume for WAL, active index, and compactor working directory.
        # Chunks and the bulk of index data now live in S3 — this PVC only needs
        # enough for the WAL (typically a few GB) and cached index files.
        # Using the 1-replica Longhorn SC: Loki is a single instance with no
        # app-layer replication, so storage-level HA is unnecessary overhead.
        storageClass: longhorn-1replica
        size: 50Gi
      resources:
        requests:
          # VPA target: 1737m CPU / 2.36Gi — raised from 200m/1Gi
          cpu: 1750m
          memory: 2500Mi
        limits:
          # VPA upper: 4095m / 5.28Gi — previous 4Gi limit was below upper and caused OOM
          cpu: 4000m
          memory: 6Gi

    # Disable scale-out components — not needed in SingleBinary mode
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    minio:
      enabled: false

    monitoring:
      dashboards:
        enabled: true
        namespace: monitoring
      rules:
        enabled: true
        labels:
          release: kube-prometheus-stack
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
        metricsInstance:
          enabled: false
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    # lokiCanary is a top-level chart value (not under monitoring:).
    # It was incorrectly nested under monitoring: before, which caused 35 canary
    # pods (one per worker) to run despite the intent to disable them.
    lokiCanary:
      enabled: false

    test:
      enabled: false

    # No ingress — Loki is only accessed internally by Alloy and Grafana
    gateway:
      enabled: false

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
