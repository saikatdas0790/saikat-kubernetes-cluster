apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.20.5"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  # ! Never uninstall Cilium on upgrade failure; it owns pod networking.
  # * Previous cross-node rolling upgrades exceeded five minutes.
  timeout: 15m
  upgrade:
    strategy:
      # ! Rollback restored the old Hubble certificate and restarted the crash loop.
      name: RetryOnFailure
      retryInterval: 2m
  values:
    # ! The serial rollout policy overrides the chart's two-unavailable-agent default.
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
    cluster:
      name: saikat-kubernetes-cluster
      id: 1

    kubeProxyReplacement: true
    k8sServiceHost: kubernetes-api.saikat.dev
    k8sServicePort: 6443

    ipam:
      mode: kubernetes

    nodeIPAM:
      enabled: true

    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true

    hubble:
      enabled: true
      relay:
        enabled: true
        replicas: 2
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
      ui:
        enabled: false
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction

    # IngressController disabled — Gateway API is the sole ingress mechanism.
    ingressController:
      enabled: false

    # Gateway API — hostNetwork mode for bare-metal port binding.
    # Cilium binds directly to ports 80/443 on every node.
    # Cloudflare proxy connects to origin port 443 → hits these pods on every CP node.
    gatewayAPI:
      enabled: true
      # ! NetBird gRPC requires TLS HTTP/2 negotiation and an h2c backend.
      enableAlpn: true
      enableAppProtocol: true
      # ! Preserve the existing CRD channel during this patch upgrade.
      # ? A separate channel migration must verify stored TLSRoute API versions.
      experimentalChannel: true
      hostNetwork:
        enabled: true

    envoy:
      enabled: true
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 1
      # Required for hostNetwork mode with privileged ports (80, 443 < 1024).
      # Without NET_BIND_SERVICE, Envoy cannot bind to ports <= 1023.
      # ref: https://docs.cilium.io/en/v1.19/network/servicemesh/gateway-api/host-network-mode/#bind-to-privileged-port
      securityContext:
        capabilities:
          keepCapNetBindService: true
          envoy:
            - NET_ADMIN # Required for IP_TRANSPARENT socket option (proxy)
            - SYS_ADMIN # Required for BPF datapath integration (< kernel 5.8)
            - NET_BIND_SERVICE # Required to bind privileged ports 80/443 on host network
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

    operator:
      replicas: 2
      # ! Node IPAM initializes at operator startup, so configuration changes must roll the operator.
      rollOutPods: true
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 128Mi

    ipv4:
      enabled: true

    ipv6:
      enabled: false

    bgpControlPlane:
      enabled: false

    # SNAT mode: DSR is incompatible with Hetzner bare metal (VIPs not bound
    # to any local interface → packet reflection).
    loadBalancer:
      algorithm: maglev
      mode: snat

    # NOTE: L2 Announcements are intentionally NOT enabled.
    # L2 ARP/NDP only works within a single L2 broadcast domain (same switch/subnet).
    # Our cluster spans multiple Hetzner DCs (FSN1, HEL1) and will include nodes from
    # other providers in the future. The only network requirement for adding nodes is
    # internet connectivity with a static IP — no L2 adjacency, no provider-specific
    # network features. Service exposure uses externalIPs (L3, works cross-provider
    # via Cilium's VXLAN tunnel) and LoadBalancer services instead.
    # Do not enable l2announcements without revisiting this constraint.

    socketLB:
      enabled: true

    hostFirewall:
      enabled: false

    bandwidthManager:
      enabled: true
      bbr: true

    localRedirectPolicy: true

    bpf:
      masquerade: true
      preallocateMaps: true

    endpointRoutes:
      enabled: true

    autoDirectNodeRoutes: false

    enableIPv4Masquerade: true
    enableIPv6Masquerade: false

    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

    seccompPath: ""

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false

    healthChecking: true

    # * Cross-provider routing — this is the ONE cluster-wide network component, and the
    # * topology below is what makes it work across Hetzner + Azure. Read before changing.
    # !
    # ! do NOT add an overlay, mesh, or route-claiming agent on top of Cilium.
    # ! squat/kilo was added for this (2026-09-26) and removed three days later: two
    # ! implementations of one layer fight over the same pod-CIDR routes, and a broken
    # ! host route stalls Flux because the apiserver calls admission webhooks.
    # *
    # * It was also unnecessary. Per Cilium's docs, "the topology of the underlying
    # * network is irrelevant as long as cluster nodes can reach each other using
    # * IP/UDP" — every node here reaches every other over its public address. Proof:
    # * cross-region pod traffic worked before any overlay existed (etcd 5 HEL / 2 FSN,
    # * CoreDNS 4/4, cert-manager 2/1).
    # *
    # * If cross-provider routing ever genuinely needs more than this, use Cilium's own
    # * features (Cluster Mesh for separate clusters, BGP for route distribution) — not
    # * a second product.
    tunnelProtocol: vxlan
    routingMode: tunnel

    hostServices:
      enabled: true
      protocols: tcp,udp

    # External IPs — enables Cilium to load-balance traffic arriving at
    # service.spec.externalIPs. Used by the PowerDNS LoadBalancer Service to
    # expose DNS on port 53 across multiple worker node IPs (cross-DC, cross-provider).
    # This is an L3 feature — each node DNATs traffic to pods via Cilium's VXLAN tunnel.
    externalIPs:
      enabled: true

    # SNAT mode for consistency with loadBalancer.mode.
    nodePort:
      enabled: true
      mode: snat

    l7Proxy: true

    dnsProxy:
      enableTransparentMode: true

    policyEnforcementMode: default

    cni:
      chainingMode: none
      exclusive: true

    tolerations:
      - operator: Exists

    debug:
      enabled: false

    rollOutCiliumPods: true
