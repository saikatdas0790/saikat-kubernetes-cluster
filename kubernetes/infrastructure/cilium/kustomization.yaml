apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# * Cilium CNI. Day-1 install is the Ansible `cilium` role (CNI must exist before Flux
# * can schedule); day-2 changes go through this HelmRelease.
#
# ! Cilium is the ONLY cross-provider network component. Do NOT add an overlay, mesh,
# ! or route-claiming agent — two implementations of one layer conflict, and a broken
# ! host route stalls Flux because the apiserver calls admission webhooks. The
# ! cross-provider reasoning lives on the routing config in helmrelease.yaml.
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - hubble-serving-certificate-rotation.yaml
