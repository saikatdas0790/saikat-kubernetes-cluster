apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vast-inference
  namespace: kube-system
spec:
  targetRefs:
    - group: ''
      kind: Service
      name: vast-inference
      sectionName: https
  validation:
    hostname: inference.saikat.dev
    caCertificateRefs:
      - group: ''
        kind: ConfigMap
        name: vast-inference-origin-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      sectionName: https-saikat-dev
  hostnames:
    - inference.saikat.dev
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /v1/models
        - method: POST
          path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - name: vast-inference
          port: 443
