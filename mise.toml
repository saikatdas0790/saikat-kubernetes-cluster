[settings]
experimental = true
age.ssh_identity_files = [".saikat-machine-access-ed25519"]
# ! Missing identities must not prevent bootstrap from extracting the identity.
age.strict = false

[tools]
age = "latest"
aws-cli = "latest"
# ! Azure CLI's macOS broker dependency has no CPython 3.15 wheels.
azure-cli = { version = "latest", python = "3.14" }
cargo-binstall = "latest"
# ! Aqua omits this signer; retain SLSA verification using Flux's release certificate.
flux2 = { version = "2.10.1", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
gh = "latest"
# ! The vfox gcloud backend imports an unavailable Lua python module before installation.
"asdf:mise-plugins/mise-gcloud" = { version = "latest", depends = ["python"] }
helm = "latest"
kubectl = "latest"
node = "latest"
pitchfork = "latest"
# * Apple's container runtime is declared in the machine-wide dotfiles on macOS.
python = "3.15.2"
rg = "latest"
"core:rust" = { version = "stable", targets = [
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-musl",
], components = [
  "rustfmt",
  "clippy",
  "rust-src",
  "rust-analyzer",
] }
sops = "latest"
uv = "latest"
"pypi:vastai" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "git@github.com:saikatdas0790/.dotfiles.git" }

[bootstrap.packages]
"apt:bind9-dnsutils" = "latest"
"apt:build-essential" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:libclang-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:musl-tools" = "latest"
"apt:pkg-config" = "latest"
# ! Podman release archives contain only the remote client; Linux needs the native engine.
"apt:podman" = "latest"

[env]
_.path = ".venv/bin"
APP_ENV = "development"
GIT_PAGER = "cat"
GH_PAGER = "cat"
PAGER = "cat"
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
CARGO_BINSTALL_DIR = "{{env.HOME}}/.local/share/cargo-binstall"
KUBECONFIG = "{{env.HOME}}/.kube/config"
RUST_LOG = "info"
CLUSTER_GITHUB_TOKEN = { age = "" }
CLUSTER_VAST_API_KEY = { age = "" }
CLUSTER_INFERENCE_API_KEY = { age = "" }

[env.CLUSTER_CLOUDFLARE_API_TOKEN]
age = ""

[env.CLUSTER_GEMINI_API_KEY]
age = ""

[task_config]
includes = [
  "mise/tasks/ansible.toml",
  "mise/tasks/infrastructure.toml",
  "mise/tasks/my-website.toml",
  "mise/tasks/renovate.toml",
  "mise/tasks/sops.toml",
  "mise/tasks/workspace.toml",
]

[daemons.my-website]
run = "node build"
dir = "apps/my-website"
ready_http = "http://localhost:8081/"
stop_signal = "SIGINT"
env = { HOST = "127.0.0.1", PORT = "8081", ORIGIN = "http://localhost:8081" }

[daemons.my-website-container]
run = '''
if [[ "$(uname)" == "Darwin" ]]; then
  exec container run --rm --platform linux/amd64 -p 8083:8080 docker.io/test/my-website:latest
else
  exec podman run --rm --platform linux/amd64 -p 8083:8080 docker.io/test/my-website:latest
fi
'''
ready_http = "http://localhost:8083/"
