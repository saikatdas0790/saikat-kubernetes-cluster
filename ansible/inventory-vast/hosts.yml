---
all:
  vars:
    vast_inference_hostname: inference.saikat.dev
    vast_inference_caddy_port: 10100
    vast_template_primary_trial:
      instance_id: 62818776
      machine_id: 135476
      previous_image: vastai/vllm:v0.32.0-cuda-13.0
      image: vastai/vllm:v0.34.0-cuda-13.0
      template_name: saikat-ripple65b-nvfp4-ssh
      model: ricursiveAI/Ripple-65B-Preview-NVFP4
      gpu_name: RTX 6000D
      gpu_count: 1
      disk_gb: 100
      origin_port: 3000
      arguments: >-
        --host 127.0.0.1 --port 18000 --tensor-parallel-size 1
        --max-model-len auto --reasoning-parser ripple
        --enable-auto-tool-choice --tool-call-parser ripple --disable-prefix-caching
    vast_inference_placements:
      - machine_id: 157825
        model: Qwen/Qwen3.8-27B
        retired_model: ricursiveAI/Ripple-65B-Preview-NVFP4
    vast_template_backup_trial:
      instance_id: 62818725
      machine_id: 140828
      previous_image: vastai/vllm:v0.32.0-cuda-13.0
      image: vastai/vllm:v0.34.0-cuda-13.0
      template_name: saikat-ripple65b-nvfp4-tp4-ssh
      model: ricursiveAI/Ripple-65B-Preview-NVFP4
      gpu_name: RTX 3090
      gpu_count: 4
      disk_gb: 100
      arguments: >-
        --host 127.0.0.1 --port 18000 --tensor-parallel-size 4
        --max-model-len auto --reasoning-parser ripple
        --enable-auto-tool-choice --tool-call-parser ripple --disable-prefix-caching
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
