[python-setup]
description = "Install the repository's declared Python tooling without provisioning credentials"
run = "python -m venv .venv && ./.venv/bin/pip install --upgrade pip && ./.venv/bin/pip install -e ."

[workspace-setup]
description = "Install workspace tools and build dependencies without changing SSH identities or cluster credentials"
run = "mise bootstrap packages apply --yes && mise install && mise run python-setup"

[bootstrap]
description = "Provision infrastructure credentials and apply Git dotfiles"
depends = ["python-setup"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

# Validate the vault password once, up front. A missing/empty/incorrect password
# (e.g. GitHub PRs from Dependabot/Renovate, which never receive repo secrets)
# must degrade to warn-and-skip below — NOT crash the whole bootstrap with a
# traceback deep inside a Python one-liner.
# Sets: bootstrap_vault_ok=true|false
bootstrap_vault_ok=false
if [ -s ansible/.vault_pass ] && \
   ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass > /dev/null 2>&1; then
  bootstrap_vault_ok=true
  echo '  ✓ Vault password valid — ansible/.vault_pass decrypts the vault'
else
  echo '  ⚠ Vault password missing or does not decrypt ansible/inventory/group_vars/all/vault.yml'
  echo '    → skipping ALL vault extractions (infra SSH key, kubeconfig, age identity).'
  echo '    → CI runs from Dependabot/Renovate PRs are expected to land here (no secrets).'
  echo '    → locally: check ansible/.vault_pass contains the real vault password.'
fi

# Extract saikat-machine-access SSH private key from Ansible vault → ./.saikat-machine-access-ed25519 (repo-local, gitignored)
# * Used for age decryption and ansible.cfg (private_key_file), and installed
# as the machine's default SSH identity below. Idempotent — skips if already present.
if [ "$bootstrap_vault_ok" = true ] && [ ! -f .saikat-machine-access-ed25519 ]; then
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_saikat_machine_access_ssh_private_key'])" \
    > .saikat-machine-access-ed25519
  chmod 600 .saikat-machine-access-ed25519
  echo '  ✓ Extracted saikat-machine-access SSH key to .saikat-machine-access-ed25519'
elif [ -f .saikat-machine-access-ed25519 ]; then
  echo '  ✓ Saikat machine-access SSH key already at .saikat-machine-access-ed25519'
fi

# Install the saikat-machine-access SSH key as the machine's DEFAULT identity (~/.ssh/id_ed25519),
# deliberately OVERWRITING any existing key (operator decision 2026-09-01: this
# vault key is the adopted identity for everything — GitHub + every node provider;
# see ansible/inventory/group_vars/all/vars.yml "single key for everything"). ssh,
# git, and ansible then pick it up automatically — locally AND on the CI runner.
if [ -f .saikat-machine-access-ed25519 ]; then
  mkdir -p ~/.ssh && chmod 700 ~/.ssh
  cp .saikat-machine-access-ed25519 ~/.ssh/id_ed25519
  chmod 600 ~/.ssh/id_ed25519
  # Regenerate the matching .pub — a stale .pub from a previous key makes SSH
  # reject the pair ("contents do not match public").
  ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
  chmod 644 ~/.ssh/id_ed25519.pub
  echo '  ✓ Installed saikat-machine-access SSH key as ~/.ssh/id_ed25519 (default machine identity)'
fi

# Extract kubeconfig from Ansible vault → ~/.kube/config (idempotent — skips if already present)
if [ "$bootstrap_vault_ok" = true ] && [ ! -f ~/.kube/config ]; then
  mkdir -p ~/.kube
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_kubeconfig'])" \
    > ~/.kube/config
  chmod 600 ~/.kube/config
  echo '  ✓ Extracted kubeconfig to ~/.kube/config'
elif [ -f ~/.kube/config ]; then
  echo '  ✓ Kubeconfig already at ~/.kube/config'
fi

mise run dotfiles-setup
'''

[dotfiles-setup]
description = "Clone or validate ~/.dotfiles and apply its Git configuration without unrelated machine setup"
env = { GIT_SSH_COMMAND = "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{config_root}}/mise/github-known-hosts' -i '{{config_root}}/.saikat-machine-access-ed25519'" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise bootstrap repos apply --yes
mise trust "$HOME/.dotfiles/mise.toml"
dotfile_arguments=(--yes "$HOME/.gitconfig")
if [[ "${GITHUB_ACTIONS:-false}" == "true" ]]; then
  dotfile_arguments+=(--force)
fi
mise --no-env --no-hooks -C "$HOME/.dotfiles" dot apply "${dotfile_arguments[@]}"
git config --get user.name
git config --get user.email
'''

[workspace-bootstrap-check]
description = "Regression-test credential-free workspace setup and Git-only dotfiles bootstrap"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import os
from pathlib import Path
import subprocess
import tomllib

with open("mise.toml", "rb") as stream:
  configuration = tomllib.load(stream)
tasks = {}
for filename in configuration["task_config"]["includes"]:
  tasks.update(tomllib.loads(Path(filename).read_text()))
assert "gcloud" not in configuration["tools"]
assert configuration["tools"]["asdf:mise-plugins/mise-gcloud"]["depends"] == ["python"]
print("PASS: workspace installation avoids the broken vfox gcloud backend", flush=True)
assert "mise run bootstrap" not in tasks["workspace-setup"]["run"]
assert "vault" not in tasks["python-setup"]["run"]
assert "python-setup" in tasks["bootstrap"]["depends"]
print("PASS: workspace setup does not provision infrastructure credentials", flush=True)
assert configuration["bootstrap"]["repos"]["~/.dotfiles"] == {"url": "git@github.com:saikatdas0790/.dotfiles.git"}
assert tasks["bootstrap"]["run"].index("mise run dotfiles-setup") > tasks["bootstrap"]["run"].index("cp .saikat-machine-access-ed25519")
assert "StrictHostKeyChecking=yes" in tasks["dotfiles-setup"]["env"]["GIT_SSH_COMMAND"]
fixture_functions = """
mise() {
  printf 'mise'; printf ' <%s>' "$@"; printf '\\n'
  if [[ "$*" == "$fixture_failure" ]]; then return 1; fi
}
git() {
  printf 'git'; printf ' <%s>' "$@"; printf '\\n'
  if [[ "$*" == "$fixture_failure" ]]; then return 1; fi
}
"""
for github_actions in [None, "false", "true"]:
  apply_command = "--no-env --no-hooks -C /fixture/.dotfiles dot apply --yes /fixture/.gitconfig"
  if github_actions == "true":
    apply_command += " --force"
  for failure in ["", "bootstrap repos apply --yes", apply_command, "config --get user.name"]:
    environment = {"PATH": os.environ["PATH"], "HOME": "/fixture", "fixture_failure": failure}
    if github_actions is not None:
      environment["GITHUB_ACTIONS"] = github_actions
    result = subprocess.run(["bash", "-c", fixture_functions + tasks["dotfiles-setup"]["run"]], env=environment, capture_output=True, text=True)
    assert (result.returncode == 0) is (failure == ""), result.stderr
    if failure:
      assert "git <config> <--get> <user.email>" not in result.stdout
    else:
      assert ('<--force>' in result.stdout) is (github_actions == "true")
      assert 'mise <--no-env> <--no-hooks> <-C> </fixture/.dotfiles> <dot> <apply> <--yes> </fixture/.gitconfig>' in result.stdout
      assert "git <config> <--get> <user.name>" in result.stdout
      assert "git <config> <--get> <user.email>" in result.stdout
    print("PASS: Git-only dotfiles setup with GITHUB_ACTIONS=" + repr(github_actions) + ", failure=" + repr(failure), flush=True)
assert not any(name.startswith(("goose_", "workstation_")) for name in configuration.get("vars", {}))
assert not any(name.startswith(("goose-", "workstation-")) for name in tasks)
assert not any(name.startswith("GOOSE_") for name in configuration["env"])
assert "goose" not in configuration["daemons"]
assert "mise/github-known-hosts" in tasks["dotfiles-setup"]["env"]["GIT_SSH_COMMAND"]
fingerprint = subprocess.check_output(["ssh-keygen", "-lf", "mise/github-known-hosts"], text=True)
assert "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" in fingerprint
print("PASS: retired tooling is absent and shared bootstrap retains pinned GitHub trust", flush=True)
'''

[setup]
description = "Install system packages, repo toolchain, and Python tooling"
run = "mise bootstrap packages apply --yes && mise install && mise run bootstrap && echo 'Environment is ready'"

[secrets-check]
description = "Verify requested age secrets are available without printing their values"
run = '''
#!/usr/bin/env python3
import os
import pathlib
import sys
import tomllib

configuration = tomllib.loads((pathlib.Path("{{config_root}}") / "mise.toml").read_text())
secret_names = sys.argv[1:] or [
  name for name, value in configuration["env"].items()
  if isinstance(value, dict) and "age" in value
]
missing_names = []
for name in secret_names:
  if os.environ.get(name):
    print(f"Available secret: {name}")
  else:
    print(f"Missing required secret: {name}", file=sys.stderr)
    missing_names.append(name)
if missing_names:
  print("Run mise run bootstrap to provision the identity, or rotate the required encrypted value with mise set --age-encrypt --prompt.", file=sys.stderr)
  sys.exit(1)
'''

[container-system-start]
description = "Ensure Apple's container apiserver is running (macOS only; no-op on Linux)"
# `container build`/`container run` need the launchd-managed apiserver up. It is
# normally started on first use, but a task whose first container invocation runs
# inside a non-interactive daemon can race it. Idempotent — exit 0 when already
# running — so it is safe as a `depends` for every container-touching task.
run = '''
if [[ "$(uname)" == "Darwin" ]]; then
  exec container system start
fi
'''

[runtime-config-check]
description = "Validate local daemon paths, ports, and task dependencies"
run = '''
#!/usr/bin/env python3
import pathlib
import tomllib
import urllib.parse

configuration = tomllib.loads(pathlib.Path("mise.toml").read_text())
assert "tasks" not in configuration
tasks = {}
for filename in configuration["task_config"]["includes"]:
  catalog = tomllib.loads(pathlib.Path(filename).read_text())
  assert not (tasks.keys() & catalog.keys()), "Duplicate tasks in " + filename
  tasks.update(catalog)
  print("Verified task catalog: " + filename)
daemons = configuration["daemons"]
for scenario in ("complete", "task-as-daemon-dependency"):
  dependencies = {name: daemon.get("depends", []) for name, daemon in daemons.items()}
  if scenario == "task-as-daemon-dependency":
    dependencies["my-website-container"] = ["container-system-start"]
  try:
    for name, required_daemons in dependencies.items():
      assert all(required_daemon in daemons for required_daemon in required_daemons), "Undefined daemon dependency: " + name
  except AssertionError:
    assert scenario != "complete", "Daemon dependencies reference a task instead of a daemon"
    print("Verified rejection of task-as-daemon-dependency regression.")
  else:
    assert scenario == "complete", "Invalid daemon dependency accepted"
    print("Verified daemon dependency references.")
website_daemon = daemons["my-website"]
assert website_daemon["run"] == "node build"
assert website_daemon["dir"] == "apps/my-website"
assert urllib.parse.urlparse(website_daemon["ready_http"]).port == int(website_daemon["env"]["PORT"])
assert website_daemon["env"]["ORIGIN"] == website_daemon["ready_http"].rstrip("/")
print("Verified website Node server path, origin, and readiness port.")
for daemon_name, build_task_name in (("my-website", "my-website-build"), ("my-website-container", "my-website-image")):
  task = tasks[daemon_name.replace("-container", "-image") + "-run"]
  assert task["depends"] == [build_task_name]
  assert not task.get("daemons"), "Task-level daemons start before builds"
  assert task["run"] == f"mise daemons restart {daemon_name}"
  print("Verified build-before-daemon startup: " + daemon_name)
assert "--platform linux/amd64" in daemons["my-website-container"]["run"]
assert "docker.io/test/my-website:latest" in daemons["my-website-container"]["run"]
assert "-t docker.io/test/my-website:latest" in tasks["my-website-image"]["run"]
print("Verified container startup uses the same platform as its build.")
for task_name, task in tasks.items():
  for dependency in task.get("depends", []):
    dependency_task, *_ = dependency.split(maxsplit=1)
    assert dependency_task in tasks, "Undefined task dependency: " + task_name + " -> " + dependency
    print(f"Verified task dependency: {task_name} -> {dependency}")
  daemon_names = task.get("daemons", [])
  if isinstance(daemon_names, list):
    assert all(daemon_name in daemons for daemon_name in daemon_names)
    if daemon_names:
      print(f"Verified task daemon references: {task_name}")
'''
